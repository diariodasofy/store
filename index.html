<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0227a">
<title>Diário da Sofy</title>
<meta name="description" content="Links e descontos">

<style>
:root{
  --pink:#e0227a;
  --pink-dark:#b81862;
  --pink-light:#fdf1f7;
  --pink-pale:#fbe6f0
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--pink-pale);
  color:#171717;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  -webkit-text-size-adjust:100%
}

/* ===== Cabeçalho estilo Linktree: avatar + nome + bio centrados ===== */

.profile{
  max-width:560px;
  margin:0 auto;
  padding:clamp(28px,8vw,44px) 20px 8px;
  text-align:center
}

.ig-avatar-link{
  display:inline-block;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(135deg,var(--pink),var(--pink-dark))
}

.ig-avatar{
  width:clamp(64px,20vw,92px);
  height:clamp(64px,20vw,92px);
  border-radius:50%;
  display:block;
  object-fit:cover;
  background:#fff;
  border:3px solid #fff
}

.profile h1{
  margin:14px 0 0;
  font-size:clamp(19px,5vw,23px);
  font-weight:800
}

.profile p{
  margin:4px 0 0;
  color:#8a5068;
  font-size:14px
}

/* ===== Redes sociais ===== */

.socials{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:16px
}

.social-link{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#fff;
  color:var(--pink-dark);
  border:1px solid #f3c6dd;
  text-decoration:none;
  box-shadow:0 2px 8px #0000000b;
  transition:transform .12s ease,box-shadow .12s ease,
             background .12s ease,color .12s ease
}

.social-link svg{
  width:19px;
  height:19px;
  display:block
}

.social-link:active{
  transform:scale(.94)
}

@media(hover:hover){
  .social-link:hover{
    background:var(--pink);
    color:#fff;
    border-color:var(--pink);
    box-shadow:0 5px 14px #e0227a26
  }
}

/* ===== Barra de pesquisa e categorias ===== */

main{
  max-width:560px;
  margin:0 auto;
  padding:18px 16px 40px
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

input,select{
  padding:12px 14px;
  border:1px solid #f3c6dd;
  border-radius:99px;
  background:#fff;
  font-size:16px
}

input{
  flex:1 1 180px;
  min-width:0
}

select{
  flex:1 1 150px
}

input:focus,select:focus{
  outline:none;
  border-color:var(--pink)
}

.cats{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:14px 0 4px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin
}

.cats::-webkit-scrollbar{
  height:4px
}

.cats button{
  border:1px solid #f3c6dd;
  background:#fff;
  color:#171717;
  border-radius:99px;
  padding:8px 14px;
  white-space:nowrap;
  font-size:13px;
  flex:0 0 auto;
  min-height:36px;
  cursor:pointer
}

.cats .active{
  background:var(--pink);
  border-color:var(--pink);
  color:#fff
}

.count{
  font-size:12px;
  color:#a05a78;
  margin:8px 2px 12px;
  text-align:center
}

/* ===== Lista de links / produtos ===== */

.grid{
  display:flex;
  flex-direction:column;
  gap:12px
}

.row{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  border-radius:18px;
  padding:10px;
  text-decoration:none;
  color:inherit;
  box-shadow:0 2px 10px #0000000d;
  border:1px solid #f7dceb;
  transition:transform .12s ease,box-shadow .12s ease
}

.row:active{
  transform:scale(.98)
}

@media(hover:hover){
  .row:hover{
    box-shadow:0 6px 18px #e0227a26;
    border-color:var(--pink)
  }
}

.thumb{
  position:relative;
  width:60px;
  height:60px;
  flex:0 0 auto;
  border-radius:14px;
  background:var(--pink-light);
  overflow:hidden
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:4px;
  display:block
}

.badge{
  position:absolute;
  top:-6px;
  left:-6px;
  background:var(--pink);
  color:#fff;
  width:20px;
  height:20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  box-shadow:0 1px 4px #0002
}

.info{
  flex:1;
  min-width:0
}

.title{
  font-size:14.5px;
  font-weight:700;
  line-height:1.25;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical
}

.sub{
  font-size:11.5px;
  color:#a05a78;
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.prices{
  display:flex;
  align-items:baseline;
  gap:6px;
  margin-top:5px;
  flex-wrap:wrap
}

.old{
  text-decoration:line-through;
  color:#bbb;
  font-size:11.5px
}

.price{
  font-size:15.5px;
  font-weight:850;
  color:var(--pink-dark)
}

.discount{
  font-size:10.5px;
  font-weight:750;
  color:#fff;
  background:var(--pink);
  padding:2px 6px;
  border-radius:99px
}

.chev{
  flex:0 0 auto;
  color:var(--pink);
  font-size:20px;
  font-weight:700;
  padding-right:2px
}

.empty{
  text-align:center;
  padding:40px 16px;
  color:#a05a78
}

footer{
  text-align:center;
  color:#c084a8;
  font-size:11px;
  padding:22px 16px
}
</style>
</head>

<body>

<div class="profile">

  <a
    id="igLink"
    class="ig-avatar-link"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Instagram"
  >
    <img
      id="igAvatar"
      class="ig-avatar"
      src=""
      alt="Foto de perfil Instagram"
      onerror="this.closest('.ig-avatar-link').style.display='none'"
    >
  </a>

  <h1 id="brand">Links e descontos</h1>
  <p id="subtitle">Diário da Sofy</p>

  <!-- ===== Redes sociais: Instagram, Facebook e TikTok ===== -->

  <div class="socials" aria-label="Redes sociais">

    <!-- Instagram -->
    <a
      id="instagramSocial"
      class="social-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
      title="Instagram"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1"></circle>
      </svg>
    </a>

    <!-- Facebook -->
    <a
      id="facebookSocial"
      class="social-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook"
      title="Facebook"
    >
      <svg viewBox="0 0 24 24" fill="currentColor"
           aria-hidden="true">
        <path d="M14 8h3V4h-3c-2.76 0-5 2.24-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.55.45-1 1-1z"></path>
      </svg>
    </a>

    <!-- TikTok -->
    <a
      id="tiktokSocial"
      class="social-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TikTok"
      title="TikTok"
    >
      <svg viewBox="0 0 24 24" fill="currentColor"
           aria-hidden="true">
        <path d="M16.5 3c.4 2.2 1.7 3.7 3.5 4.2v3.1c-1.4 0-2.7-.4-3.8-1.1v6.4c0 4-2.7 6.4-6.2 6.4C7 22 4.5 19.7 4.5 16.5c0-3.1 2.4-5.7 5.6-5.9v3.2c-1.3.1-2.3 1.2-2.3 2.6 0 1.5 1 2.6 2.4 2.6 1.5 0 2.5-1 2.5-2.8V3h3.8z"></path>
      </svg>
    </a>

  </div>

</div>

<main>

  <div class="controls">
    <input
      id="search"
      placeholder="🔎 Pesquisar produtos..."
      oninput="render()"
      aria-label="Pesquisar produtos"
    >

    <select id="sort" onchange="render()" aria-label="Ordenar produtos">
      <option value="featured">Destaques primeiro</option>
      <option value="priceAsc">Preço menor → maior</option>
      <option value="priceDesc">Preço maior → menor</option>
      <option value="name">Nome A → Z</option>
    </select>
  </div>

  <div id="cats" class="cats"></div>
  <div id="count" class="count"></div>
  <div id="grid" class="grid"></div>

</main>

<footer>
  Alguns links podem ser links de afiliado.
  A compra é efetuada diretamente no parceiro.
</footer>

<script>

/* ============================================================
   CONFIGURAÇÃO PRINCIPAL
   ============================================================ */

/*
   URL DE EXPORTAÇÃO CSV DO GOOGLE SHEETS

   Formato:
   https://docs.google.com/spreadsheets/d/SEU_ID/export?format=csv&gid=SEU_GID
*/

const SHEET_CSV_URL =
  "https://docs.google.com/spreadsheets/d/1EOmLMeyr1qAnZreTuKBlGpbbcYQzy-HrH9Nlu7U2ato/export?format=csv&gid=0";

const BRAND_NAME = "Diário da Sofy";
const SUBTITLE = "Links e descontos";


/* ============================================================
   REDES SOCIAIS
   ============================================================ */

/*
   ALTERA AQUI OS 3 LINKS DAS REDES SOCIAIS.

   A ordem apresentada no site será:
   1. Instagram
   2. Facebook
   3. TikTok
*/

const INSTAGRAM_URL = "https://www.instagram.com/diariodasofy40/";
const FACEBOOK_URL = "https://www.facebook.com/diariodasofy";
const TIKTOK_URL = "https://www.tiktok.com/@sofiag5083";


/* ============================================================
   FOTO DE PERFIL DO INSTAGRAM
   ============================================================ */

/*
   O Instagram normalmente bloqueia o carregamento direto da
   foto de perfil a partir de outro site.

   Utiliza aqui um URL direto para a imagem.
*/

const INSTAGRAM_AVATAR_URL =
  "https://diariodasofy.github.io/store/insta_perfil.jpeg";


/* ============================================================
   DADOS
   ============================================================ */

let products = [];
let selectedCategory = "";


/* ============================================================
   FUNÇÕES AUXILIARES
   ============================================================ */

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && quoted && next === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      quoted = !quoted;
    } else if (char === "," && !quoted) {
      row.push(cell);
      cell = "";
    } else if ((char === "\n" || char === "\r") && !quoted) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell);

      if (row.some(value => value.trim() !== "")) {
        rows.push(row);
      }

      row = [];
      cell = "";

    } else {
      cell += char;
    }
  }

  if (cell !== "" || row.length) {
    row.push(cell);

    if (row.some(value => value.trim() !== "")) {
      rows.push(row);
    }
  }

  if (!rows.length) {
    return [];
  }

  const headers = rows
    .shift()
    .map(value => value.trim().toLowerCase());

  return rows.map(values =>
    Object.fromEntries(
      headers.map((header, index) => [
        header,
        (values[index] || "").trim()
      ])
    )
  );
}


function num(value) {
  const cleaned = String(value || "")
    .replace(/[^\d,.-]/g, "")
    .replace(/\.(?=\d{3}(?:\D|$))/g, "")
    .replace(",", ".");

  return parseFloat(cleaned) || 0;
}


function esc(value = "") {
  return String(value).replace(
    /[&<>"']/g,
    match => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[match]
  );
}


/* ============================================================
   PRODUTO DE DEMONSTRAÇÃO
   ============================================================ */

function demo() {
  return [
    {
      ativo: "SIM",
      nome: "Produto de exemplo",
      categoria: "Destaques",
      imagem: "https://placehold.co/700x700?text=Produto",
      preco: "199,90 €",
      preco_anterior: "249,90 €",
      descricao: "Substitua este produto pelos seus dados.",
      parceiro: "Loja parceira",
      url: "https://example.com",
      destaque: "SIM"
    }
  ];
}


/* ============================================================
   CARREGAR GOOGLE SHEETS
   ============================================================ */

async function load() {

  try {

    if (SHEET_CSV_URL.startsWith("COLE_")) {
      products = demo();
    } else {

      const response = await fetch(SHEET_CSV_URL);

      if (!response.ok) {
        throw new Error("Erro ao carregar Google Sheets.");
      }

      const csv = await response.text();
      products = parseCSV(csv);
    }

    buildCats();
    render();

  } catch (error) {

    console.error(error);

    document.getElementById("grid").innerHTML =
      '<div class="empty">Erro ao carregar o Google Sheets.</div>';

  }
}


/* ============================================================
   CATEGORIAS
   ============================================================ */

function buildCats() {

  const categories = [
    ...new Set(
      products
        .filter(product =>
          String(product.ativo || "").toUpperCase() === "SIM"
        )
        .map(product => product.categoria)
        .filter(Boolean)
    )
  ].sort((a, b) => a.localeCompare(b, "pt"));

  const cats = document.getElementById("cats");

  cats.innerHTML =
    '<button class="active" type="button" onclick="setCat(this, \'\')">Todos</button>' +
    categories
      .map(category =>
        '<button type="button" onclick="setCat(this, ' +
        JSON.stringify(category) +
        ')">' +
        esc(category) +
        "</button>"
      )
      .join("");
}


/* ============================================================
   SELEÇÃO DE CATEGORIA
   ============================================================ */

function setCat(element, category) {

  selectedCategory = category;

  document
    .querySelectorAll(".cats button")
    .forEach(button => button.classList.remove("active"));

  element.classList.add("active");

  render();
}


/* ============================================================
   RENDERIZAR PRODUTOS
   ============================================================ */

function render() {

  const searchElement = document.getElementById("search");
  const sortElement = document.getElementById("sort");

  const query = searchElement.value.trim().toLowerCase();
  const sort = sortElement.value;

  const filtered = products.filter(product => {

    const active =
      String(product.ativo || "").toUpperCase() === "SIM";

    const categoryMatch =
      !selectedCategory ||
      product.categoria === selectedCategory;

    const searchText = [
      product.nome,
      product.descricao,
      product.parceiro,
      product.categoria
    ]
      .join(" ")
      .toLowerCase();

    const searchMatch =
      !query || searchText.includes(query);

    return active && categoryMatch && searchMatch;
  });


  filtered.sort((a, b) => {

    if (sort === "priceAsc") {
      return num(a.preco) - num(b.preco);
    }

    if (sort === "priceDesc") {
      return num(b.preco) - num(a.preco);
    }

    if (sort === "name") {
      return String(a.nome || "").localeCompare(
        String(b.nome || ""),
        "pt"
      );
    }

    return (
      (String(b.destaque || "").toUpperCase() === "SIM") -
      (String(a.destaque || "").toUpperCase() === "SIM")
    );
  });


  const count = document.getElementById("count");
  const grid = document.getElementById("grid");

  count.textContent =
    filtered.length +
    " produto" +
    (filtered.length === 1 ? "" : "s");

  grid.innerHTML = filtered.length
    ? filtered.map(card).join("")
    : '<div class="empty">Nenhum produto encontrado.</div>';
}


/* ============================================================
   CARTÃO DO PRODUTO
   ============================================================ */

function card(product) {

  const oldPrice = num(product.preco_anterior);
  const currentPrice = num(product.preco);

  const discount =
    oldPrice > currentPrice
      ? Math.round((1 - currentPrice / oldPrice) * 100)
      : 0;

  const featured =
    String(product.destaque || "").toUpperCase() === "SIM";

  return (
    '<a class="row" href="' +
    esc(product.url) +
    '" target="_blank" rel="noopener noreferrer sponsored" ' +
    'data-product="' +
    esc(product.nome) +
    '" data-partner="' +
    esc(product.parceiro) +
    '">' +

      '<div class="thumb">' +

        '<img src="' +
        esc(product.imagem) +
        '" alt="' +
        esc(product.nome) +
        '" loading="lazy">' +

        (
          featured
            ? '<span class="badge">⭐</span>'
            : ""
        ) +

      '</div>' +

      '<div class="info">' +

        '<div class="title">' +
        esc(product.nome) +
        '</div>' +

        '<div class="sub">' +
        esc(product.parceiro) +
        (
          product.categoria
            ? " · " + esc(product.categoria)
            : ""
        ) +
        '</div>' +

        '<div class="prices">' +

          (
            oldPrice > currentPrice
              ? '<span class="old">' +
                esc(product.preco_anterior) +
                "</span>"
              : ""
          ) +

          '<span class="price">' +
          esc(product.preco) +
          "</span>" +

          (
            discount
              ? '<span class="discount">-' +
                discount +
                "%</span>"
              : ""
          ) +

        '</div>' +

      '</div>' +

      '<div class="chev">›</div>' +

    '</a>'
  );
}


/* ============================================================
   TRACKING
   ============================================================ */

function track(product, partner) {

  if (typeof window.gtag === "function") {

    window.gtag("event", "partner_click", {
      product_name: product,
      partner: partner
    });

  }
}


/* ============================================================
   CONFIGURAR CABEÇALHO
   ============================================================ */

document.getElementById("brand").textContent = BRAND_NAME;
document.getElementById("subtitle").textContent = SUBTITLE;


/* ============================================================
   INSTAGRAM
   ============================================================ */

document.getElementById("igLink").href = INSTAGRAM_URL;
document.getElementById("instagramSocial").href = INSTAGRAM_URL;


/* ============================================================
   FACEBOOK
   ============================================================ */

document.getElementById("facebookSocial").href = FACEBOOK_URL;


/* ============================================================
   TIKTOK
   ============================================================ */

document.getElementById("tiktokSocial").href = TIKTOK_URL;


/* ============================================================
   AVATAR
   ============================================================ */

if (INSTAGRAM_AVATAR_URL) {

  document.getElementById("igAvatar").src =
    INSTAGRAM_AVATAR_URL;

} else {

  document.querySelector(".ig-avatar-link").style.display =
    "none";
}


/* ============================================================
   TRACKING DOS CLIQUES NOS PRODUTOS
   ============================================================ */

document.getElementById("grid").addEventListener(
  "click",
  event => {

    const link = event.target.closest(".row");

    if (!link) {
      return;
    }

    track(
      link.dataset.product || "",
      link.dataset.partner || ""
    );

  }
);


/* ============================================================
   INICIAR
   ============================================================ */

load();

</script>

</body>
</html>
